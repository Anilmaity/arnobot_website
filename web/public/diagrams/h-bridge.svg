<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="480" height="200" rx="14" fill="#eef1fb"/>
  <g stroke="#1b1550" stroke-width="2.4" fill="none">
    <!-- top & bottom rails -->
    <line x1="120" y1="40" x2="360" y2="40"/>
    <line x1="120" y1="160" x2="360" y2="160"/>
    <!-- supply rails to V+ and GND -->
    <line x1="240" y1="40" x2="240" y2="22"/>
    <line x1="240" y1="160" x2="240" y2="178"/>
    <!-- left leg -->
    <line x1="120" y1="40" x2="120" y2="78"/>
    <line x1="120" y1="122" x2="120" y2="160"/>
    <!-- right leg -->
    <line x1="360" y1="40" x2="360" y2="78"/>
    <line x1="360" y1="122" x2="360" y2="160"/>
    <!-- motor wires -->
    <line x1="120" y1="100" x2="195" y2="100"/>
    <line x1="285" y1="100" x2="360" y2="100"/>
  </g>
  <!-- four switches (transistors) -->
  <g fill="#375E9D" stroke="#1b1550" stroke-width="2">
    <rect x="106" y="78" width="28" height="22" rx="3"/>
    <rect x="106" y="100" width="28" height="22" rx="3"/>
    <rect x="346" y="78" width="28" height="22" rx="3"/>
    <rect x="346" y="100" width="28" height="22" rx="3"/>
  </g>
  <!-- motor -->
  <circle cx="240" cy="100" r="30" fill="#ffffff" stroke="#230C75" stroke-width="3"/>
  <text x="231" y="106" fill="#230C75" font-size="20" font-weight="800">M</text>
  <g fill="#1b1550" font-size="13" font-weight="700">
    <text x="96" y="74">S1</text>
    <text x="96" y="138">S2</text>
    <text x="378" y="74">S3</text>
    <text x="378" y="138">S4</text>
    <text x="250" y="18">V+</text>
    <text x="248" y="192">GND</text>
  </g>
</svg>
