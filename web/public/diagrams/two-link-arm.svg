<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="480" height="200" rx="14" fill="#eef1fb"/>
  <!-- ground / base -->
  <rect x="70" y="160" width="80" height="14" rx="3" fill="#230C75"/>
  <g stroke-linecap="round">
    <!-- link 1 -->
    <line x1="110" y1="160" x2="210" y2="78" stroke="#375E9D" stroke-width="12"/>
    <!-- link 2 -->
    <line x1="210" y1="78" x2="350" y2="110" stroke="#5E8EE6" stroke-width="12"/>
  </g>
  <!-- joints (revolute = circles) -->
  <circle cx="110" cy="160" r="11" fill="#ffffff" stroke="#1b1550" stroke-width="3"/>
  <circle cx="210" cy="78" r="11" fill="#ffffff" stroke="#1b1550" stroke-width="3"/>
  <!-- end effector -->
  <g stroke="#1b1550" stroke-width="3" fill="none">
    <path d="M350,110 l16,-9 M350,110 l16,9"/>
  </g>
  <circle cx="350" cy="110" r="4" fill="#230C75"/>
  <g fill="#1b1550" font-size="14" font-weight="700">
    <text x="86" y="186">J1</text>
    <text x="196" y="64">J2</text>
    <text x="356" y="100">end-effector</text>
  </g>
  <text x="150" y="22" fill="#1b1550" font-size="13" font-weight="700">Planar manipulator (2 links)</text>
</svg>
